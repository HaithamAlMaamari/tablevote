name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Documentation links
        run: npm run check:docs
      - name: Repository files
        run: npm run check:repo
      - name: Fictional catalog
        run: npm run check:catalog
      - name: Test
        run: npm run test:coverage
      - name: Tooling tests
        run: npm run test:tooling
      - name: Production dependency policy
        run: npm run audit:prod
      - name: Full dependency policy
        run: npm run audit:all
      - name: Build
        run: npm run build
      - name: Install browser matrix
        if: matrix.node-version == 22
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser and accessibility tests
        if: matrix.node-version == 22
        run: npm run test:browser:built
      - name: Upload browser report
        if: failure() && matrix.node-version == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 3
      - name: Production-only runtime smoke
        run: |
          npm prune --omit=dev
          npm run smoke:prod:built
