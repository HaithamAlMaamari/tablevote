name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Documentation links
        run: npm run check:docs
      - name: Repository files
        run: npm run check:repo
      - name: Fictional catalog
        run: npm run check:catalog
      - name: Test
        run: npm run test:coverage
      - name: Tooling tests
        run: npm run test:tooling
      - name: Production dependency policy
        run: npm run audit:prod
      - name: Full dependency policy
        run: npm run audit:all
      - name: Build
        run: npm run build
      - name: Install browser matrix
        if: matrix.node-version == 22
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser and accessibility tests
        if: matrix.node-version == 22
        run: npm run test:browser:built
      - name: Upload browser report
        if: failure() && matrix.node-version == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 3
      - name: Production-only runtime smoke
        run: |
          npm prune --omit=dev
          npm run smoke:prod:built
