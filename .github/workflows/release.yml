name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify release target
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected"
      - run: npm ci
      - name: Verify release source
        run: npm run verify
      - name: Smoke production process
        run: npm run smoke:prod:built
      - name: Build release evidence
        shell: bash
        run: |
          npm sbom --sbom-format cyclonedx > "tablevote-$GITHUB_REF_NAME.sbom.cdx.json"
          git archive --format=zip --output="tablevote-$GITHUB_REF_NAME.zip" HEAD
          sha256sum "tablevote-$GITHUB_REF_NAME.zip" "tablevote-$GITHUB_REF_NAME.sbom.cdx.json" > "tablevote-$GITHUB_REF_NAME.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "tablevote-$GITHUB_REF_NAME.zip"
          "tablevote-$GITHUB_REF_NAME.sbom.cdx.json"
          "tablevote-$GITHUB_REF_NAME.sha256"
          --verify-tag
          --title "TableVote $GITHUB_REF_NAME"
          --generate-notes
