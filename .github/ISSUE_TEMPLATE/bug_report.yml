name: Bug report
description: Report reproducible behavior that differs from the documented prototype
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues and check the README troubleshooting section first.
        Never include live invite codes, capabilities, ballots, dietary requirements,
        nicknames, exact locations, authorization headers, or unredacted logs.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, and what user-visible state did you see?
      placeholder: The host selected Reveal after two ballots were submitted, but the collecting state remained visible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Cite documentation or explain the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      placeholder: "1. Run npm run dev\n2. Create a session\n3. Join from a separate browser profile\n4. ..."
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Development server (npm run dev)
        - Built single-port server (npm run build && npm start)
        - Loopback proxy harness
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node version, browser/version, and the commit or branch.
      placeholder: Windows 11, Node 24.x, Firefox x, main at commit abc1234
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Minimal redacted diagnostics
      description: Include only lines needed to explain the failure. Replace every session-specific value.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and reviewed the README troubleshooting guidance.
          required: true
        - label: I removed all private session, participant, location, and authorization data.
          required: true
