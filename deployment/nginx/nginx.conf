events {}

http {
  # Do not log paths, query strings, request bodies, or authorization headers.
  log_format tablevote_safe '$remote_addr $request_method $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log tablevote_safe;
  # Nginx warning/error messages can embed request URIs. Emit only fatal proxy failures.
  error_log /var/log/nginx/error.log crit;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream tablevote {
    server host.docker.internal:3001;
  }

  server {
    listen 8080;
    server_name _;
    return 308 https://$host:8443$request_uri;
  }

  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    location / {
      proxy_pass http://tablevote;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
